services:
  db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: scholarly
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - db-data:/var/lib/postgresql/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d social"]
      interval: 5s
      timeout: 5s
      retries: 5
