services:
  db:
    image: postgres:17-alpine
    container_name: pg-db
    environment:
      POSTGRES_DB: scholarly
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d scholarly"]
      interval: 5s
      timeout: 5s
      retries: 5
  migrate:
    image: migrate/migrate
    env_file:
      - .env
    volumes:
      - ./database/migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /migrate -path=/migrations -database "$DATABASE_URL" up
  cache:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: api
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
