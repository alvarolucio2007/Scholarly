definitions:
  github_com_alvarolucio2007_Scholarly_internal_domain.EnrollmentStatus:
    enum:
    - active
    - cancelled
    - completed
    type: string
    x-enum-varnames:
    - StatusActive
    - StatusCancelled
    - StatusCompleted
  github_com_alvarolucio2007_Scholarly_internal_domain.SituationStatus:
    enum:
    - approved
    - cancelled
    - recovery
    type: string
    x-enum-varnames:
    - StatusApproved
    - StatusFailed
    - StatusRecovery
  internal_adapters_http.CourseResponseDTO:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      max_students:
        type: integer
      name:
        type: string
      semester:
        type: string
      teacher_id:
        type: integer
      updated_at:
        type: string
    type: object
  internal_adapters_http.CreateCourseDTO:
    properties:
      code:
        maxLength: 50
        type: string
      max_students:
        minimum: 1
        type: integer
      name:
        maxLength: 255
        type: string
      semester:
        maxLength: 50
        type: string
      teacher_id:
        minimum: 1
        type: integer
    required:
    - code
    - max_students
    - name
    - semester
    - teacher_id
    type: object
  internal_adapters_http.CreateGradeDTO:
    properties:
      enrollment_id:
        minimum: 1
        type: integer
      test_id:
        minimum: 1
        type: integer
      value:
        maximum: 10
        minimum: 0
        type: number
    required:
    - enrollment_id
    - test_id
    - value
    type: object
  internal_adapters_http.CreateStudentDTO:
    properties:
      enrollment_number:
        type: string
      user_id:
        minimum: 1
        type: integer
    required:
    - enrollment_number
    - user_id
    type: object
  internal_adapters_http.CreateTeacherDTO:
    properties:
      department:
        maxLength: 100
        type: string
      user_id:
        minimum: 1
        type: integer
    required:
    - department
    - user_id
    type: object
  internal_adapters_http.CreateTestDTO:
    properties:
      course_id:
        minimum: 1
        type: integer
      name:
        maxLength: 255
        type: string
      test_date:
        example: "2026-03-15T00:00:00Z"
        type: string
      weight:
        type: number
    required:
    - course_id
    - name
    - test_date
    - weight
    type: object
  internal_adapters_http.CreateUserDTO:
    properties:
      cpf:
        maxLength: 14
        type: string
      email:
        type: string
      name:
        maxLength: 255
        type: string
      password:
        minLength: 8
        type: string
    required:
    - cpf
    - email
    - name
    - password
    type: object
  internal_adapters_http.CreateUserTokenPayloadDTO:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 3
        type: string
    required:
    - email
    - password
    type: object
  internal_adapters_http.EnrollStudentDTO:
    properties:
      course_id:
        minimum: 1
        type: integer
      student_id:
        minimum: 1
        type: integer
    required:
    - course_id
    - student_id
    type: object
  internal_adapters_http.EnrollmentResponseDTO:
    properties:
      course_id:
        type: integer
      enrolled_at:
        type: string
      id:
        type: integer
      status:
