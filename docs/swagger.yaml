  internal_adapters_http.UpdateTeacherDTO:
    properties:
      department:
        maxLength: 100
        type: string
      user_id:
        minimum: 1
        type: integer
    required:
    - user_id
    type: object
  internal_adapters_http.UpdateTestDTO:
    properties:
      course_id:
        minimum: 1
        type: integer
      id:
        minimum: 1
        type: integer
      name:
        minLength: 1
        type: string
      test_date:
        type: string
      weight:
        type: number
    required:
    - id
    - name
    type: object
  internal_adapters_http.UpdateUserDTO:
    properties:
      cpf:
        example: ""
        maxLength: 14
        type: string
      email:
        example: ""
        type: string
      id:
        minimum: 1
        type: integer
      name:
        example: ""
        maxLength: 255
        type: string
