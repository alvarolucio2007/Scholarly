definitions:
  internal_adapters_http.CourseResponseDTO:
    properties:
      code:
        type: string
      created_at:
        type: string
      id:
        type: integer
      max_students:
        type: integer
      name:
        type: string
      semester:
        type: string
      teacher_id:
        type: integer
      updated_at:
        type: string
    type: object
  internal_adapters_http.CreateCourseDTO:
    properties:
      code:
        maxLength: 50
        type: string
      max_students:
        minimum: 1
        type: integer
      name:
        maxLength: 255
        type: string
      semester:
        maxLength: 50
        type: string
      teacher_id:
        minimum: 1
        type: integer
    required:
    - code
    - max_students
    - name
    - semester
    - teacher_id
    type: object
  internal_adapters_http.CreateGradeDTO:
    properties:
      enrollment_id:
        minimum: 1
        type: integer
      test_id:
        minimum: 1
        type: integer
      value:
        maximum: 10
        minimum: 0
        type: number
    required:
    - enrollment_id
    - test_id
    - value
    type: object
  internal_adapters_http.CreateStudentDTO:
    properties:
      enrollment_number:
        type: string
      user_id:
        minimum: 1
        type: integer
    required:
    - enrollment_number
    - user_id
    type: object
  internal_adapters_http.CreateTestDTO:
    properties:
      course_id:
        minimum: 1
        type: integer
      name:
        type: string
      test_date:
        type: string
      weight:
        type: number
    required:
    - course_id
    - name
    - test_date
    type: object
  internal_adapters_http.CreateUserDTO:
    properties:
      cpf:
        maxLength: 14
        type: string
      email:
        type: string
      name:
        maxLength: 255
        type: string
      password:
        type: string
    required:
    - cpf
    - email
    - name
    - password
    type: object
  internal_adapters_http.EnrollmentResponseDTO:
    properties:
      course_id:
        type: integer
      enrolled_at:
        type: string
      id:
        type: integer
      status:
        type: string
      student_id:
        type: integer
    type: object
  internal_adapters_http.GradeResponseDTO:
    properties:
      created_at:
        type: string
      enrollment_id:
        type: integer
      id:
        type: integer
      test_id:
        type: integer
      updated_at:
        type: string
      value:
        type: number
    type: object
  internal_adapters_http.StudentResponseDTO:
    properties:
      enrollment_number:
        type: string
      user_id:
        type: integer
    type: object
  internal_adapters_http.TeacherResponseDTO:
    properties:
      department:
        type: string
      user_id:
        type: integer
    type: object
  internal_adapters_http.TestResponseDTO:
    properties:
      course_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      name:
        type: string
      test_date:
        type: string
      updated_at:
        type: string
      weight:
        type: number
    type: object
  internal_adapters_http.UpdateCourseDTO:
    properties:
      code:
        maxLength: 50
        type: string
      id:
        minimum: 1
        type: integer
      max_students:
        maximum: 50
        type: integer
      name:
        maxLength: 50
        type: string
      semester:
        maxLength: 50
        type: string
      teacher_id:
        minimum: 1
        type: integer
    required:
    - id
    type: object
  internal_adapters_http.UpdateEnrollmentDTO:
    properties:
      course_id:
        minimum: 1
        type: integer
      id:
        minimum: 1
        type: integer
      student_id:
        minimum: 1
        type: integer
    type: object
  internal_adapters_http.UpdateGradeDTO:
    properties:
      enrollment_id:
        minimum: 1
        type: integer
      id:
        minimum: 1
        type: integer
      test_id:
        minimum: 1
        type: integer
      value:
        maximum: 10
