        name: payload
        required: true
        schema:
          $ref: '#/definitions/internal_adapters_http.CreateUserTokenPayloadDTO'
      produces:
      - application/json
      responses:
        "200":
          description: token registered
          schema:
            type: string
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      summary: Creates a token
      tags:
      - authentication
